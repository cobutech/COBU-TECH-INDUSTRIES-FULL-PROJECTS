<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBU-NET Administration</title>
  <link rel="stylesheet" href="administration.css" />
</head>
<body>

  <!-- HEADER (Height: 100px) -->
  <header class="app-header glowing-border">
    <div class="header-content">
      
      <!-- 1. Sidebar Toggle Button -->
      <button id="sidebar-toggle" class="header-item glowing-container btn-icon" aria-label="Toggle Sidebar">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- 2. Website Logo (Circular) -->
      <div class="header-item glowing-container logo-container">
        <img src="https://via.placeholder.com/50/007bff/ffffff?text=CN" alt="COBU-NET Logo" class="circular-logo" />
      </div>

      <!-- 3. Website Name -->
      <div class="header-item glowing-container brand-container">
        <h1 class="brand-title">COBU-NET</h1>
      </div>

      <!-- 4. Search Bar -->
      <div class="header-item glowing-container search-container">
        <input type="text" placeholder="Search..." class="search-input" />
        <button class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <!-- 5. Notification Bell (Yellow Coded SVG) -->
      <div class="header-item glowing-container notification-container" id="notification-btn">
        <svg class="bell-icon" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge">3</span>
      </div>

      <!-- 6. Admin Profile Picture (Circular) -->
      <div class="header-item glowing-container profile-container">
        <img src="https://via.placeholder.com/50/ff4757/ffffff?text=Admin" alt="Admin Profile" class="circular-profile" />
      </div>

    </div>
  </header>

  <!-- BODY SECTION -->
  <div class="app-body">
    <!-- Sidebar -->
    <aside id="sidebar" class="sidebar glowing-border">
      <nav class="sidebar-nav">
        <ul>
          <li><a href="#" class="active">Dashboard</a></li>
          <li><a href="#">Users</a></li>
          <li><a href="#">Network</a></li>
          <li><a href="#">Settings</a></li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <section class="content-card glowing-border">
        <h2>Welcome to COBU-NET Admin Panel</h2>
        <p>This is your main dashboard workspace.</p>
      </section>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="app-footer glowing-border">
    <p>&copy; 2026 COBU-NET. All Rights Reserved.</p>
  </footer>

  <script src="administration.js"></script>
</body>
</html>
