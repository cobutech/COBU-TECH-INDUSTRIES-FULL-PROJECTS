<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>COBU-NET Administration</title>
  <link rel="stylesheet" href="administration.css" />
</head>
<body>

  <!-- HEADER (Height: 130px) -->
  <header class="app-header">
    
    <!-- LEFT SECTION -->
    <div class="header-left">
      <div class="logo-container glowing-container">
        <img src="https://via.placeholder.com/70/007bff/ffffff?text=CN" alt="COBU-NET Logo" class="square-logo" />
      </div>

      <div class="sidebar-btn-container glowing-container">
        <button id="sidebar-toggle" class="sidebar-btn" aria-label="Toggle Sidebar">
          <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none">
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- CENTER SECTION -->
    <div class="header-center">
      <h1 class="brand-title">COBU-NET</h1>

      <div class="search-container glowing-container">
        <input type="text" placeholder="Search..." class="search-input" />
        <button class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>

      <div id="quick-action-target"></div>
    </div>

    <!-- RIGHT SECTION -->
    <div class="header-right">
      <div class="notification-wrapper" id="notification-btn">
        <svg class="bell-icon" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="notification-badge">3</span>
      </div>

      <div class="profile-container glowing-container">
        <img src="https://via.placeholder.com/45/ff4757/ffffff?text=Admin" alt="Admin Profile" class="circular-profile" />
      </div>
    </div>

  </header>

  <!-- BODY SECTION -->
  <div class="app-body">
    <aside id="sidebar" class="sidebar collapsed">
      <div id="sidebar-nav-target"></div>
    </aside>

    <main class="main-content">
      <section class="content-card">
        <h2>Welcome to COBU-NET Admin Panel</h2>
        <p>Select an item from the sidebar to begin.</p>
      </section>
    </main>
  </div>

  <!-- FOOTER -->
  <footer class="app-footer">
    <p>&copy; 2026 COBU-NET. All Rights Reserved.</p>
  </footer>

  <script src="administration.js"></script>
</body>
</html>
